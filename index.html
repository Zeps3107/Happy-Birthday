<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>HBD R.A Septiana</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />
</head>
    <body style="background-image: url(https://plus.unsplash.com/premium_photo-1765796096863-05dbe7561ace?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwyfHx8ZW58MHx8fHx8);" class="flex justify-center h-screen items-center"
>

<div class="bg-white border px-10 py-8 border-4 border-gray-300 shadow-lg shadow-blue-300 rounded-xl text-center animate__animated animate__backInDown m-8 w-80" 
id="kartu"
>
    <h1 class="text-3xl text-red-500">Happy Birthday</h1>
    <h1 class="p-2 text-4xl text-blue-500 font-bold animate__animated animate__pulse animate__infinite"
    >
    R.A Septiana</h1>
    <button class="p-2 bg-blue-400 text-white rounded mt-5 hover:bg-blue-900 transition ease-in w-full animate__animated animate__delay-1s animate__tada" 
    onclick="ubahkartu()"
    >
    Klik Disini Raa!</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js"></script>
<script>
    const duration = 15 * 1000,
  animationEnd = Date.now() + duration,
  defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

function randomInRange(min, max) {
  return Math.random() * (max - min) + min;
}

const interval = setInterval(function() {
  const timeLeft = animationEnd - Date.now();

  if (timeLeft <= 0) {
    return clearInterval(interval);
  }

  const particleCount = 50 * (timeLeft / duration);

  // since particles fall down, start a bit higher than random
  confetti(
    Object.assign({}, defaults, {
      particleCount,
      origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 },
    })
  );
  confetti(
    Object.assign({}, defaults, {
      particleCount,
      origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 },
    })
  );
}, 250);
let kartu = document.getElementById("kartu")
function ubahkartu() {
    kartu.innerHTML = `<h1 class="font-semibold text-wrap animate__animated animate__zoomIn">
    Selamat ulang tahun ke-22, Ara. Semoga di usia ini kamu bisa berjalan lebih tenang, lebih jujur pada diri sendiri, dan tetap menemukan bahagia dalam hal-hal sederhana. Jika ada lelah di perjalanan, semoga selalu ada harapan yang membuatmu bertahan dan tersenyum. Semoga hari-harimu ke depan dipenuhi makna dan kebaikan.
</h1><h2 class="mt-3 animate__animated animate__fadeIn">
    - Dari : Nana Septiana -
</h2>
<button class="p-2 bg-slate-400 text-white rounded mt-5 hover:bg-slate-900 transition ease-in w-full animate__animated animate__delay-1s animate__tada" 
onclick="refresh()"
>
tutup</button>
`;

}
function refresh() {
    location.reload();
}
</script>
</body>
</html>
